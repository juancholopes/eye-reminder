<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="lid" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4CC2FF"/>
      <stop offset="0.55" stop-color="#1A86E8"/>
      <stop offset="1" stop-color="#0B4FB8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sclera" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E6F8"/>
    </radialGradient>
    <radialGradient id="pupil" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#2A5BB0"/>
      <stop offset="1" stop-color="#0A1F4D"/>
    </radialGradient>
    <linearGradient id="badge" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFC83D"/>
      <stop offset="1" stop-color="#F7630C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- Hueco alrededor de la insignia para separarla del ojo -->
    <mask id="cut">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <circle cx="194" cy="194" r="62" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#cut)">
    <path d="M12 116 C52 18 188 18 228 116 C188 214 52 214 12 116 Z" fill="#00205A" opacity="0.25" filter="url(#shadow)" transform="translate(0 7)"/>
    <path d="M12 116 C52 18 188 18 228 116 C188 214 52 214 12 116 Z" fill="url(#lid)"/>
    <path d="M24 106 C66 34 174 34 216 106 C172 84 68 84 24 106 Z" fill="url(#sheen)"/>
    <circle cx="120" cy="116" r="60" fill="url(#sclera)"/>
    <circle cx="120" cy="116" r="34" fill="url(#pupil)"/>
    <ellipse cx="106" cy="101" rx="11" ry="9" fill="#FFFFFF" opacity="0.92"/>
  </g>

  <!-- Insignia de reloj: el recordatorio periódico -->
  <circle cx="194" cy="198" r="50" fill="#5A2000" opacity="0.18" filter="url(#shadow)"/>
  <circle cx="194" cy="194" r="52" fill="url(#badge)"/>
  <path d="M194 172 V194 L218 208" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
